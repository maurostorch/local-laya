# NVIDIA override: docker compose -f docker-compose.yml -f docker-compose.cuda.yml up -d --build
services:
  laya:
    build:
      args:
        TORCH_INDEX: ${LAYA_TORCH_INDEX:-cu128}
    image: laya:0.3.20-${LAYA_TORCH_INDEX:-cu128}
    environment:
      LAYA_DEVICE: ${LAYA_DEVICE:-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LAYA_GPU_ID:-0}"]
              capabilities: [gpu]
