server {
    listen 8080;
    root /usr/share/nginx/html;

    # Same-origin proxy, because laya-serve sends no CORS headers.
    location /v1/ {
        proxy_pass http://laya:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }

    location = /health {
        proxy_pass http://laya:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
